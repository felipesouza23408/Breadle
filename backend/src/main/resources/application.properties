spring.application.name=Breadle Backend
spring.config.import=optional:file:../.env[.properties]

# Banco de dados principal (PostgreSQL via Docker Compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/breadle}
spring.datasource.username=${DB_USERNAME:breadle}
spring.datasource.password=${DB_PASSWORD:breadle123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway para migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Segurança / JWT
jwt.secret=${JWT_SECRET:breadle-dev-secret-change-me-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Armazenamento local para arquivos antes de trocar por MinIO/S3
breadle.storage.local-path=${STORAGE_PATH:./storage}

# API
server.port=8080
server.servlet.context-path=/api
