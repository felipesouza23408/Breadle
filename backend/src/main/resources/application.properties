spring.application.name=Breadle Backend
spring.config.import=optional:file:../.env[.properties]

# Banco de dados principal (PostgreSQL via Docker Compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/breadle}
spring.datasource.username=${DB_USERNAME:breadle}
spring.datasource.password=${DB_PASSWORD:breadle123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway para migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Segurança / JWT
jwt.secret=${JWT_SECRET:breadle-dev-secret-change-me-32-chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# E-mail para redefinição de senha (configure SMTP no arquivo .env)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
breadle.email.from=${MAIL_FROM:no-reply@breadle.com}
breadle.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Armazenamento local para arquivos antes de trocar por MinIO/S3
breadle.storage.local-path=${STORAGE_PATH:./storage}

# IA: provedor externo via API compatível com OpenAI
breadle.ai.enabled=${AI_ENABLED:false}
breadle.ai.daily-limit=${AI_DAILY_LIMIT:20}
breadle.ai.model=${OPENAI_MODEL:gpt-4o-mini}
breadle.ai.openai.api-key=${OPENAI_API_KEY:}
breadle.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# API
server.port=8080
server.servlet.context-path=/api
