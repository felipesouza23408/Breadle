services:
  postgres:
    image: postgres:16-alpine
    container_name: breadle-postgres
    environment:
      POSTGRES_DB: breadle
      POSTGRES_USER: breadle
      POSTGRES_PASSWORD: breadle123
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
