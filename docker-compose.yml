services:
  postgres:
    image: postgres:16-alpine
    container_name: breadle-postgres
    environment:
      POSTGRES_DB: breadle
      POSTGRES_USER: ${DB_USERNAME:-breadle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-breadle123}
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: breadle-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
